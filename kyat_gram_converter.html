<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ကျပ် ပဲ ရွေး ↔ ဂရမ် Converter</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#f3f7fc;color:#17345f;font-family:Arial,"Noto Sans Myanmar",sans-serif}
main{max-width:760px;margin:28px auto;background:#fff;border:1px solid #dce8f8;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #18365d12}
header{padding:30px 24px;text-align:center;background:#eaf3ff}
h1{font-size:clamp(22px,4vw,32px);margin:0 0 8px}
.sub{color:#59718f;margin:0 0 18px}
.rate{display:inline-block;padding:10px 18px;border-radius:24px;background:#d7e9ff;font-weight:bold}
.content{padding:26px}
label{display:block;font-weight:bold;margin-bottom:9px}
.grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input{width:100%;min-width:0;padding:13px 10px;border:1px solid #cbd9eb;border-radius:10px;font-size:20px;color:#17345f;background:#fff}
input:focus{outline:2px solid #8bbcff;border-color:#659fe9}
.symbol{font-size:24px;color:#6682a6;padding:0 2px 12px}
.result{padding:14px;border-radius:10px;background:#edf5ff;border:1px solid #cbdff7;min-height:52px;font-size:22px;font-weight:bold;overflow-wrap:anywhere}
.result-label{margin-top:8px;color:#647b98;font-size:13px}
.quick{margin-top:24px;padding:16px;border:1px solid #e0eaf7;border-radius:12px;background:#f8fbff}
.quick strong{display:block;margin-bottom:12px}
.buttons{display:flex;flex-wrap:wrap;gap:8px}
button{border:1px solid #c8d8ec;background:white;color:#345477;border-radius:9px;padding:9px 13px;font-size:15px;cursor:pointer}
button:hover{background:#eaf3ff;border-color:#80afea}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button{flex:1;background:#245b9c;color:white;border-color:#245b9c}
.actions button.secondary{background:white;color:#345477;border-color:#c8d8ec}
.note{text-align:center;color:#71839b;font-size:13px;margin:18px 0 0}
@media(max-width:560px){body{padding:12px}main{margin:10px auto}.content{padding:18px}.grid{grid-template-columns:1fr;gap:12px}.symbol{text-align:center;padding:0;transform:rotate(90deg)}}
</style>
</head>
<body>
<main>
<header>
<h1>ကျပ် ပဲ ရွေး ↔ ဂရမ်</h1>
<p class="sub">Kyat, Pe, Yway to Gram Converter</p>
<div class="rate">၁ ကျပ် = ၁၆.၆ g</div>
</header>
<section class="content">
<div class="grid">
<div>
<label for="kyat">ကျပ်</label>
<input id="kyat" type="number" min="0" step="1" value="1" inputmode="decimal">
</div>
<div class="symbol">＋</div>
<div>
<label for="gram">ဂရမ် (g)</label>
<div id="gram" class="result" aria-live="polite">16.6 g</div>
<div class="result-label">စုစုပေါင်း အလေးချိန်</div>
</div>
</div>
<div style="height:16px"></div>
<div class="units">
<div><label for="pe">ပဲ</label><input id="pe" type="number" min="0" step="1" value="0" inputmode="decimal"></div>
<div><label for="yway">ရွေး</label><input id="yway" type="number" min="0" step="1" value="0" inputmode="decimal"></div>
<div><label>နှုန်းထား</label><div class="result" style="font-size:16px">၁၆.၆ g</div></div>
</div>
<div class="quick">
<strong>အမြန်ရွေးချယ်ရန် (ကျပ်)</strong>
<div class="buttons">
<button type="button" data-kyat="1">၁ ကျပ်</button>
<button type="button" data-kyat="5">၅ ကျပ်</button>
<button type="button" data-kyat="10">၁၀ ကျပ်</button>
<button type="button" data-kyat="20">၂၀ ကျပ်</button>
<button type="button" data-kyat="50">၅၀ ကျပ်</button>
<button type="button" data-kyat="100">၁၀၀ ကျပ်</button>
</div>
</div>
<div class="actions">
<button type="button" id="copy">ရလဒ်ကူးယူရန်</button>
<button type="button" class="secondary" id="reset">ပြန်စရန်</button>
</div>
<p class="note">တွက်ချက်မှု: (ကျပ် + ပဲ ÷ ၁၆ + ရွေး ÷ ၁၂၈) × ၁၆.၆</p>
</section>
</main>
<script>
const kyat=document.getElementById('kyat'), pe=document.getElementById('pe'), yway=document.getElementById('yway'), gram=document.getElementById('gram');
function calculate(){
 const k=Math.max(0,Number(kyat.value)||0), p=Math.max(0,Number(pe.value)||0), y=Math.max(0,Number(yway.value)||0);
 const total=(k+p/16+y/128)*16.6;
 gram.textContent=Number(total.toFixed(6)).toLocaleString('en-US',{maximumFractionDigits:6})+' g';
}
[kyat,pe,yway].forEach(el=>el.addEventListener('input',calculate));
document.querySelectorAll('[data-kyat]').forEach(btn=>btn.addEventListener('click',()=>{kyat.value=btn.dataset.kyat;pe.value=0;yway.value=0;calculate()}));
document.getElementById('reset').addEventListener('click',()=>{kyat.value=0;pe.value=0;yway.value=0;calculate()});
document.getElementById('copy').addEventListener('click',async()=>{const text=gram.textContent;try{await navigator.clipboard.writeText(text);document.getElementById('copy').textContent='ကူးယူပြီးပါပြီ';setTimeout(()=>document.getElementById('copy').textContent='ရလဒ်ကူးယူရန်',1500)}catch{alert(text)}});
calculate();
</script>
</body>
</html>
